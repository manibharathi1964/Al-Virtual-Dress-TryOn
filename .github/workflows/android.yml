name: AI Virtual Dress Try-On Android Build

on:
  push:
    branches: [ main, phase-9-privacy-hardening ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Al-Virtual-Dress-TryOn.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Virtual-Dress-TryOn-apk
          path: Al-Virtual-Dress-TryOn.apk
